[package]
name = "rustc_plugin"
version = "0.15.0-nightly-2026-10-06"
edition = "2024"
authors = ["Will Crichton <crichton.will@gmail.com>"]
description = "A framework for writing plugins that integrate with the Rust compiler"
repository = "https://github.com/cognitive-engineering-lab/rustc_plugin"
license = "MIT"

[package.metadata.rust-analyzer]
rustc_private = true

[dependencies]
log = "0.4"
cargo_metadata = "0.14"
serde = "1"
serde_json = "1"
thiserror = "2.0.18"

[dev-dependencies]
anyhow = { version = "1", features = ["backtrace"] }

[build-dependencies]
log = "0.4"
toml = "0.7"

